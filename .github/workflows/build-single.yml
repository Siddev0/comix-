name: Build Single Extension
on:
  workflow_dispatch:
    inputs:
      extension_path:
        description: 'Gradle path (e.g. :src:en:comix)'
        required: true
        default: ':src:en:comix'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        run: ./gradlew ${{ github.event.inputs.extension_path }}:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Comix-Extension-APK
          path: src/**/build/outputs/apk/debug/*.apk
          
